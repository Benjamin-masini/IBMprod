<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Marketplace Immobilier</title>

      <style>
      body {
        font-family: Arial;
        margin: 0;
        background: #f5f5f5;
      }
      
      header {
        background: #2c3e50;
        color: white;
        padding: 15px;
        text-align: center;
      }
      
      input, select, button {
        padding: 8px;
        margin: 5px;
      }
      
      .container {
        display: flex;
      }
      
      .filters {
        width: 20%;
        padding: 20px;
        background: white;
      }
      
      .listings {
        width: 80%;
        display: flex;
        flex-wrap: wrap;
        padding: 20px;
      }
      
      .card {
        background: white;
        width: 250px;
        margin: 10px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 5px rgba(0,0,0,0.2);
      }
      
      .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
      }
      
      .card-body {
        padding: 10px;
      }
      
      .price {
        color: green;
        font-weight: bold;
      }
      
      .heart {
        cursor: pointer;
        font-size: 20px;
      }
      
      .form-container {
        background: white;
        padding: 15px;
        margin: 10px;
      }
      </style>

</head>

<body>

    <header>
      <h1>🏠 Marketplace Immobilier</h1>
    </header>
    
    <div class="form-container">
      <h3>Ajouter une annonce</h3>
      <input type="text" id="title" placeholder="Titre">
      <input type="text" id="city" placeholder="Ville">
      <input type="number" id="price" placeholder="Prix">
      <select id="type">
        <option value="maison">Maison</option>
        <option value="appartement">Appartement</option>
      </select>
      <input type="text" id="image" placeholder="URL image">
      <button onclick="addProperty()">Ajouter</button>
    </div>
    
    <div class="container">
    
      <div class="filters">
        <h3>Filtres</h3>
        <input type="text" id="search" placeholder="Ville...">
        <input type="number" id="maxPrice" placeholder="Prix max">
      </div>
    
      <div class="listings" id="listings"></div>
    
    </div>

    <script>
    
    // 🔹 Charger données
    let properties = JSON.parse(localStorage.getItem("properties")) || [
      {
        id: 1,
        title: "Maison moderne",
        city: "Paris",
        price: 300000,
        type: "maison",
        image: "https://via.placeholder.com/300"
      }
    ];
    
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    
    // 🔹 Sauvegarde
    function saveData() {
      localStorage.setItem("properties", JSON.stringify(properties));
      localStorage.setItem("favorites", JSON.stringify(favorites));
    }
    
    // 🔹 Ajouter annonce
    function addProperty() {
      const newProperty = {
        id: Date.now(),
        title: document.getElementById("title").value,
        city: document.getElementById("city").value,
        price: parseInt(document.getElementById("price").value),
        type: document.getElementById("type").value,
        image: document.getElementById("image").value || "https://via.placeholder.com/300"
      };
    
      properties.push(newProperty);
      saveData();
      displayProperties(properties);
    }
    
    // 🔹 Favoris
    function toggleFavorite(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(f => f !== id);
      } else {
        favorites.push(id);
      }
      saveData();
      displayProperties(properties);
    }
    
    // 🔹 Affichage
    function displayProperties(list) {
      const container = document.getElementById("listings");
      container.innerHTML = "";
    
      list.forEach(p => {
        const isFav = favorites.includes(p.id);
    
        container.innerHTML += `
          <div class="card">
            <img src="${p.image}">
            <div class="card-body">
              <h4>${p.title}</h4>
              <p>${p.city}</p>
              <p class="price">${p.price} €</p>
              <span class="heart" onclick="toggleFavorite(${p.id})">
                ${isFav ? "❤️" : "🤍"}
              </span>
            </div>
          </div>
        `;
      });
    }
    
    // 🔹 Filtres
    function filterProperties() {
      const search = document.getElementById("search").value.toLowerCase();
      const maxPrice = document.getElementById("maxPrice").value;
    
      const filtered = properties.filter(p => {
        return (
          (!search || p.city.toLowerCase().includes(search)) &&
          (!maxPrice || p.price <= maxPrice)
        );
      });
    
      displayProperties(filtered);
    }
    
    document.getElementById("search").addEventListener("input", filterProperties);
    document.getElementById("maxPrice").addEventListener("input", filterProperties);
    
    // 🔹 Initialisation
    displayProperties(properties);
    
    </script>

</body>
</html>
