<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="shortcut icon" type="image/x-icon" href="PHOTOS/BEBOL2S.png">
<title>IBMndaku</title>

<style>
body { font-family: Arial; margin: 0; background: #f5f5f5; }

header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

  .logo {
    max-width: 120px;
    height: auto;
    margin-bottom: 15px;
    animation: fadeIn 0.6s ease-out;
}

button { padding: 8px; margin: 5px; cursor: pointer; }

.nav {
  text-align: center;
  margin: 10px;
}

.container {
  display: flex;
}

.listings {
  display: flex;
  flex-wrap: wrap;
  padding: 20px;
}

.card {
  background: white;
  width: 250px;
  margin: 10px;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 5px rgba(0,0,0,0.2);
}

.card img {
  width: 100%;
  height: 150px;
  object-fit: cover;
}

.card-body { padding: 10px; }

.price { color: green; font-weight: bold; }

.heart { cursor: pointer; font-size: 20px; }

.delete { color: red; cursor: pointer; }

.hidden { display: none; }

.detail {
  padding: 20px;
}

.detail img {
  width: 100%;
  max-width: 400px;
}

/* FOOTER */
footer {
    font-style: oblique;
    color: darkgoldenrod;
    text-align: center;
    background-color: #333;
    padding: 20px;
    margin-top: 60px;
}

footer p1, footer pA, footer pB {
    display: block;
    font-size: 13px;
    color: white;
    margin: 3px 0;
}

footer p2 {
    display: block;
    font-size: 12px;
    color: #999;
    margin-top: 10px;
}

/* RESPONSIVE DESIGN */
@media (max-width: 768px) {
    body {
        min-height: 100vh;
    }

    .container {
        padding: 20px 10px;
    }

    .recovery-wrapper {
        padding: 25px;
        border-radius: 12px;
    }

    .logo{
        max-width: 100px;
    }

</style>

</head>

<body>

<header>
  <img src="PHOTOS/BEBOL2S.png" alt="BEBOL Logo" class="logo">
  <h1>🏠 IBMndaku</h1>
</header>

<div class="nav">
  <button onclick="showHome()">Accueil</button>
  <button onclick="showFavorites()">❤️ Favoris</button>
</div>

<!-- 🔹 PAGE ACCUEIL -->
<div id="home">

  <h3 style="text-align:center;">Ajouter une annonce</h3>
  <div style="text-align:center;">
    <input id="title" placeholder="Titre">
    <input id="city" placeholder="Ville">
    <input id="price" type="number" placeholder="Prix">
    <input id="image" placeholder="URL image">
    <button onclick="addProperty()">Ajouter</button>
  </div>

  <div class="listings" id="listings"></div>

</div>

<!-- 🔹 PAGE FAVORIS -->
<div id="favoritesPage" class="hidden">
  <h2 style="text-align:center;">❤️ Mes favoris</h2>
  <div class="listings" id="favoritesList"></div>
</div>

<!-- 🔹 PAGE DETAIL -->
<div id="detailPage" class="hidden">
  <button onclick="showHome()">⬅ Retour</button>
  <div class="detail" id="detailContent"></div>
</div>

<script>

// 🔹 DATA
let properties = JSON.parse(localStorage.getItem("properties")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

// 🔹 SAVE
function saveData() {
  localStorage.setItem("properties", JSON.stringify(properties));
  localStorage.setItem("favorites", JSON.stringify(favorites));
}

// 🔹 NAVIGATION
function showHome() {
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("favoritesPage").classList.add("hidden");
  document.getElementById("detailPage").classList.add("hidden");
  displayProperties(properties);
}

function showFavorites() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("favoritesPage").classList.remove("hidden");
  document.getElementById("detailPage").classList.add("hidden");

  const favList = properties.filter(p => favorites.includes(p.id));
  displayFavorites(favList);
}

function showDetail(id) {
  const p = properties.find(p => p.id === id);

  document.getElementById("home").classList.add("hidden");
  document.getElementById("favoritesPage").classList.add("hidden");
  document.getElementById("detailPage").classList.remove("hidden");

  document.getElementById("detailContent").innerHTML = `
    <h2>${p.title}</h2>
    <img src="${p.image}">
    <p><strong>Ville :</strong> ${p.city}</p>
    <p><strong>Prix :</strong> ${p.price} €</p>
  `;
}

// 🔹 ADD
function addProperty() {
  const newProperty = {
    id: Date.now(),
    title: title.value,
    city: city.value,
    price: parseInt(price.value),
    image: image.value || "https://via.placeholder.com/300"
  };

  properties.push(newProperty);
  saveData();
  displayProperties(properties);
}

// 🔹 DELETE
function deleteProperty(id) {
  properties = properties.filter(p => p.id !== id);
  favorites = favorites.filter(f => f !== id);
  saveData();
  displayProperties(properties);
}

// 🔹 FAVORITES
function toggleFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
  } else {
    favorites.push(id);
  }
  saveData();
  displayProperties(properties);
}

// 🔹 DISPLAY HOME
function displayProperties(list) {
  const container = document.getElementById("listings");
  container.innerHTML = "";

  list.forEach(p => {
    const isFav = favorites.includes(p.id);

    container.innerHTML += `
      <div class="card">
        <img src="${p.image}" onclick="showDetail(${p.id})">
        <div class="card-body">
          <h4>${p.title}</h4>
          <p>${p.city}</p>
          <p class="price">${p.price} €</p>

          <span class="heart" onclick="toggleFavorite(${p.id})">
            ${isFav ? "❤️" : "🤍"}
          </span>

          <span class="delete" onclick="deleteProperty(${p.id})">
            🗑️
          </span>
        </div>
      </div>
    `;
  });
}

// 🔹 DISPLAY FAVORITES
function displayFavorites(list) {
  const container = document.getElementById("favoritesList");
  container.innerHTML = "";

  list.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.image}" onclick="showDetail(${p.id})">
        <div class="card-body">
          <h4>${p.title}</h4>
          <p>${p.city}</p>
          <p class="price">${p.price} €</p>
        </div>
      </div>
    `;
  });
}

// 🔹 INIT
displayProperties(properties);

</script>

</body>
<footer>
    <p>ibmprod45@gmail.com | IBMprod | +243853193403</p>
    <p>copyright &copy; BEBOL2022 par IBMprod</p>
</footer>
</html>
