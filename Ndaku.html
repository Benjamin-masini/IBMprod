<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IBMprod | Ndaku</title>

      <style>
      body {
        font-family: Arial;
        margin: 0;
        background: #f5f5f5;
      }
      
      header {
        background: #2c3e50;
        color: white;
        padding: 15px;
        text-align: center;
      }
      
      input, select, button {
        padding: 8px;
        margin: 5px;
        cursor: pointer;
      }
    .Ajouter{
        background: #f5f5f5;
    }
      
      .container {
        display: flex;
      }
      
      .filters {
        width: 20%;
        padding: 20px;
        background: white;
      }
      
      .listings {
        width: 80%;
        display: flex;
        flex-wrap: wrap;
        padding: 20px;
      }
      
      .card {
        background: white;
        width: 250px;
        margin: 10px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 5px rgba(0,0,0,0.2);
      }
      
      .card img {
        width: 100%;
        height: 150px;
        object-fit: cover;
      }
      
      .card-body {
        padding: 10px;
      }
      
      .price {
        color: darkgoldenrod;
        font-weight: bold;
      }
      
      .heart {
        cursor: pointer;
        font-size: 20px;
      }
      
      .form-container {
        background: white;
        padding: 15px;
        margin: 10px;
      }
    .delete { color: red; 
             cursor: pointer; 
    }
    .hidden { display: none; }

    .detail {
      padding: 20px;
    }
    
    .detail img {
      width: 100%;
      max-width: 400px;
    }
      </style>

</head>

<body>

    <header>
      <h1>🏠 IBMndaku</h1>
      <div class="nav">
          <button onclick="showHome()">Accueil</button>
          <button onclick="showFavorites()">❤️ Favoris</button>
     </div>
    </header>
    
    <div class="form-container">
      <h3>Ajouter une annonce</h3>
      <input type="text" id="title" placeholder="Titre et description">
      <input type="text" id="city" placeholder="Ville">
      <input type="number" id="price" placeholder="Prix">
        
      <select id="type">
        <option value="maison">Maison</option>
        <option value="appartement">Appartement</option>
        <option value="Parcelle">Parcelle ou Terrain</option>
      </select>
        
      <input type="text" id="image" placeholder="URL image">
      <button onclick="addProperty()" class="Ajouter">Ajouter</button>
    </div>
    
    <div class="container">

        <!-- FILTRE -->
          <div class="filters">
            <h3>Filtres</h3>
            <input type="text" id="search" placeholder="Ville...">
            <input type="number" id="maxPrice" placeholder="Prix max">
          </div>

                <!-- ANNONCE -->
          <div class="listings" id="listings"></div>
        
                <!-- 🔹 PAGE FAVORIS -->
          <div id="favoritesPage" class="hidden">
              <h2 style="text-align:center;">❤️ Mes favoris</h2>
              <div class="listings" id="favoritesList"></div>
          </div>
            <!-- 🔹 PAGE DETAIL -->
         <div id="detailPage" class="hidden">
              <button onclick="showHome()">⬅ Retour</button>
              <div class="detail" id="detailContent"></div>
          </div>
      </div>

    <script>
    
    // 🔹 Charger données
 // 🔹 DATA
let properties = JSON.parse(localStorage.getItem("properties")) || [];
let favorites = JSON.parse(localStorage.getItem("favorites")) || [];

// 🔹 SAVE
function saveData() {
  localStorage.setItem("properties", JSON.stringify(properties));
  localStorage.setItem("favorites", JSON.stringify(favorites));
}

// 🔹 NAVIGATION
function showHome() {
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("favoritesPage").classList.add("hidden");
  document.getElementById("detailPage").classList.add("hidden");
  displayProperties(properties);
}

function showFavorites() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("favoritesPage").classList.remove("hidden");
  document.getElementById("detailPage").classList.add("hidden");

  const favList = properties.filter(p => favorites.includes(p.id));
  displayFavorites(favList);
}

function showDetail(id) {
  const p = properties.find(p => p.id === id);

  document.getElementById("home").classList.add("hidden");
  document.getElementById("favoritesPage").classList.add("hidden");
  document.getElementById("detailPage").classList.remove("hidden");

  document.getElementById("detailContent").innerHTML = `
    <h2>${p.title}</h2>
    <img src="${p.image}">
    <p><strong>Ville :</strong> ${p.city}</p>
    <p><strong>Prix :</strong> ${p.price} €</p>
  `;
}

// 🔹 ADD
function addProperty() {
  const newProperty = {
    id: Date.now(),
    title: title.value,
    city: city.value,
    price: parseInt(price.value),
    image: image.value || "https://via.placeholder.com/300"
  };

  properties.push(newProperty);
  saveData();
  displayProperties(properties);
}

// 🔹 DELETE
function deleteProperty(id) {
  properties = properties.filter(p => p.id !== id);
  favorites = favorites.filter(f => f !== id);
  saveData();
  displayProperties(properties);
}

// 🔹 FAVORITES
function toggleFavorite(id) {
  if (favorites.includes(id)) {
    favorites = favorites.filter(f => f !== id);
  } else {
    favorites.push(id);
  }
  saveData();
  displayProperties(properties);
}

// 🔹 DISPLAY HOME
function displayProperties(list) {
  const container = document.getElementById("listings");
  container.innerHTML = "";

  list.forEach(p => {
    const isFav = favorites.includes(p.id);

    container.innerHTML += `
      <div class="card">
        <img src="${p.image}" onclick="showDetail(${p.id})">
        <div class="card-body">
          <h4>${p.title}</h4>
          <p>${p.city}</p>
          <p class="price">${p.price} €</p>

          <span class="heart" onclick="toggleFavorite(${p.id})">
            ${isFav ? "❤️" : "🤍"}
          </span>

          <span class="delete" onclick="deleteProperty(${p.id})">
            🗑️
          </span>
        </div>
      </div>
    `;
  });
}

// 🔹 DISPLAY FAVORITES
function displayFavorites(list) {
  const container = document.getElementById("favoritesList");
  container.innerHTML = "";

  list.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.image}" onclick="showDetail(${p.id})">
        <div class="card-body">
          <h4>${p.title}</h4>
          <p>${p.city}</p>
          <p class="price">${p.price} €</p>
        </div>
      </div>
    `;
  });
}

// 🔹 INIT
displayProperties(properties);    
    </script>

</body>
</html>
